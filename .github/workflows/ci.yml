# Checks on every push: PHP syntax, translations (same keys in de and en), and the release zip
# installed into Kimai 2.67 (dev/ci.sh).
#
# Public mirror: Gitea pushes every branch and tag here on each commit.
# This runs the checks and reports them back to the commit on Gitea as
# the status "github / test", where the pull requests live. There are no
# pull requests on GitHub, so everything runs on push.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the
# repository (commit statuses).
name: CI

on:
  push:
    branches: ["**"]

# No concurrency group: every commit runs to the end and keeps its own
# status, a newer push does not cancel an older run.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/kimai-holiday-bundle/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - uses: actions/checkout@v4

      - name: CHANGELOG.md headings
        run: scripts/release-notes.sh --check

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Translations (same keys in de and en)
        run: php dev/check-translations.php

  kimai:
    name: Kimai 2.67 end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIMAI_VERSION: '2.67.0'
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kimai
          MARIADB_USER: kimai
          MARIADB_PASSWORD: kimai
        # random host port: two jobs on the same runner must not both claim 3306
        ports: ['3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, zip, xsl, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Database host
        # Gitea runner: job container reaches the service by name; GitHub: service port on localhost
        env:
          HOST_PORT: ${{ job.services.mariadb.ports['3306'] }}
        run: |
          host=127.0.0.1 port="$HOST_PORT"
          if getent hosts mariadb > /dev/null; then host=mariadb port=3306; fi
          echo "DATABASE_URL=mysql://kimai:kimai@$host:$port/kimai?charset=utf8mb4&serverVersion=10.11.0-MariaDB" >> "$GITHUB_ENV"

      - name: Build plugin zip (same as release)
        working-directory: plugin
        run: git archive --format=zip --prefix=HolidayBundle/ -o ../HolidayBundle-ci.zip HEAD

      - name: Install Kimai
        run: plugin/dev/ci-kimai.sh kimai

      - name: Test the zip in Kimai
        run: plugin/dev/ci.sh kimai HolidayBundle-ci.zip

  # Also runs when a check failed or was cancelled, so Gitea never keeps a
  # stale "pending". success only if every check passed, failure if one
  # failed, otherwise error (cancelled, skipped).
  report:
    needs: [lint, kimai]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          state=success
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              failure) state=failure ;;
              *) if [ "$state" = success ]; then state=error; fi ;;
            esac
          done
          desc=$state
          if [ -n "$STARTED" ]; then desc="$state in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          STARTED: ${{ needs.lint.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
