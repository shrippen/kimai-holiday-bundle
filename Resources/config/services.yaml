services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KimaiPlugin\HolidayBundle\:
        resource: '../../*'
        exclude:
            - '../../demo/'
            - '../../dev/'
            - '../../Tests/'
            - '../../Migrations/'
            - '../../Resources/'
            - '../../DependencyInjection/'
            - '../../Controller/'
            - '../../API/'
            - '../../Ics/'

    KimaiPlugin\HolidayBundle\Controller\:
        resource: '../../Controller'
        tags: ['controller.service_arguments']
        public: true

    KimaiPlugin\HolidayBundle\API\:
        resource: '../../API'
        tags: ['controller.service_arguments']

    KimaiPlugin\HolidayBundle\Ics\:
        resource: '../../Ics'
        tags: ['controller.service_arguments']
        public: true

    KimaiPlugin\HolidayBundle\Form\Extension\UserContractTypeExtension:
        tags:
            - { name: form.type_extension }

    # Kimai's mailer adds the From address (MAILER_FROM); Symfony's own mailer rejects mails without one
    KimaiPlugin\HolidayBundle\Service\AbsenceNotifier:
        arguments:
            $mailer: '@App\Mail\KimaiMailer'
